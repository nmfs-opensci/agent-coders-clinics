AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LiteLLM gateway smoke test: one EC2 instance running LiteLLM + Postgres in
  Docker, calling coding models on Amazon Bedrock with the instance role.
  Admins can also reach it by SSM port forwarding (scripts/tunnel.sh). Secrets live in
  SSM Parameter Store under /<stack name>/ and are created by
  scripts/make_secrets.py before this stack is deployed. Caddy serves it over
  HTTPS at <elastic ip>.sslip.io (or DomainName) with a Let's Encrypt certificate.

Parameters:
  LiteLLMImage:
    Type: String
    # v1.102.1, pinned by digest (multi-arch index; includes arm64).
    Default: ghcr.io/berriai/litellm-database:v1.102.1@sha256:c38fe5eff11874941a21f5630ceb842f640dee7d5d5cde440b60ed0a71798f33
  CaddyImage:
    Type: String
    # 2.11.4, pinned by digest (multi-arch; includes arm64).
    Default: public.ecr.aws/docker/library/caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
  DomainName:
    Type: String
    Default: ""
    Description: >
      Optional host name for HTTPS, with a DNS A record pointing at the Elastic
      IP. Empty means <elastic ip>.sslip.io, which needs no domain.
  PostgresImage:
    Type: String
    Default: public.ecr.aws/docker/library/postgres:16-alpine
  InstanceType:
    Type: String
    Default: t4g.small
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      # A public address lets the instance reach Bedrock, SSM and the image
      # registries without a NAT gateway. Nothing inbound is allowed.
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Inbound HTTPS (and HTTP for certificate issue); outbound HTTPS only
      VpcId: !Ref Vpc
      # Caddy answers here; every API call still needs a LiteLLM key.
      # Port 80 serves the Let's Encrypt challenge and redirects to HTTPS.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: bedrock-and-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Exactly the models in config.yaml below; keep the two lists in step.
              # Claude goes through us. inference profiles, which need the profile
              # and the underlying model in every Region the profile routes to.
              - Sid: InvokeServedModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-opus-4-6-v1
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-opus-4-6-v1
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/qwen.qwen3-coder-480b-a35b-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/qwen.qwen3-coder-30b-a3b-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/mistral.devstral-2-123b
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/moonshotai.kimi-k2.5
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/zai.glm-5
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/minimax.minimax-m2.5
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/deepseek.v3.2
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0
              - Sid: ReadOwnSecrets
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          # 2 hops so the LiteLLM container can get the instance role's credentials.
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

  # A fixed address, so the HTTPS name survives stop/start. Costs the same as
  # the auto-assigned public IPv4 while attached to the instance.
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # Runs once at first boot. Output goes to /var/log/litellm-setup.log;
            # secret values are only written to root-only env files, never logged.
            set -euo pipefail
            exec > >(tee -a /var/log/litellm-setup.log) 2>&1
            dnf install -y docker
            systemctl enable --now docker
            mkdir -p /opt/litellm/pgdata
            cd /opt/litellm

            get() {
              aws ssm get-parameter --region ${AWS::Region} --with-decryption \
                --name "/${AWS::StackName}/$1" --query Parameter.Value --output text
            }
            MASTER=$(get master-key)
            DBPW=$(get db-password)
            SALT=$(get salt-key)
            UIPW=$(get ui-password)

            umask 077
            printf 'POSTGRES_USER=litellm\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=litellm\n' "$DBPW" > db.env
            printf 'LITELLM_MASTER_KEY=%s\nLITELLM_SALT_KEY=%s\nDATABASE_URL=postgresql://litellm:%s@db:5432/litellm\nAWS_REGION=${AWS::Region}\n' \
              "$MASTER" "$SALT" "$DBPW" > litellm.env
            # Admin UI login: its own password, so the master key is never typed in a browser.
            printf 'UI_USERNAME=admin\nUI_PASSWORD=%s\nPROXY_BASE_URL=https://${Hostname}\n' "$UIPW" >> litellm.env
            unset MASTER DBPW SALT UIPW
            umask 022

            cat > config.yaml <<'CONFIG'
            model_list:
              # Coding models only. Claude models are named by their Anthropic API
              # IDs so Claude Code recognizes them (name, context, price). Other
              # models use the Converse API with prices set here: us-east-2 on-demand
              # rates from the AWS Pricing API (2026-09-25), because LiteLLM's own
              # price list lacks some of them for this Region and a missing price
              # would record $0 spend and make budgets useless.
              # Claude caching for OpenAI-style tools (Copilot CLI, OpenCode, Aider):
              # LiteLLM adds cache markers on the system prompt and the latest
              # message. It stands down when the client sets its own markers, so
              # Claude Code is unaffected.
              - model_name: claude-sonnet-4-6
                litellm_params:
                  model: bedrock/us.anthropic.claude-sonnet-4-6
                  aws_region_name: ${AWS::Region}
                  cache_control_injection_points:
                    - location: message
                      role: system
                    - location: message
                      index: -1
              - model_name: claude-haiku-4-5-20251001
                litellm_params:
                  model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
                  aws_region_name: ${AWS::Region}
                  cache_control_injection_points:
                    - location: message
                      role: system
                    - location: message
                      index: -1
              - model_name: claude-opus-4-6
                litellm_params:
                  model: bedrock/us.anthropic.claude-opus-4-6-v1
                  aws_region_name: ${AWS::Region}
                  cache_control_injection_points:
                    - location: message
                      role: system
                    - location: message
                      index: -1
              - model_name: qwen3-coder-480b
                litellm_params:
                  model: bedrock/converse/qwen.qwen3-coder-480b-a35b-v1:0
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.00000045
                  output_cost_per_token: 0.0000018
              - model_name: qwen3-coder-30b
                litellm_params:
                  model: bedrock/converse/qwen.qwen3-coder-30b-a3b-v1:0
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.00000015
                  output_cost_per_token: 0.0000006
              - model_name: devstral-2
                litellm_params:
                  model: bedrock/converse/mistral.devstral-2-123b
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.0000004
                  output_cost_per_token: 0.000002
              - model_name: kimi-k2.5
                litellm_params:
                  model: bedrock/converse/moonshotai.kimi-k2.5
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.0000006
                  output_cost_per_token: 0.000003
              - model_name: glm-5
                litellm_params:
                  model: bedrock/converse/zai.glm-5
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.000001
                  output_cost_per_token: 0.0000032
              - model_name: minimax-m2.5
                litellm_params:
                  model: bedrock/converse/minimax.minimax-m2.5
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.0000003
                  output_cost_per_token: 0.0000012
              - model_name: deepseek-v3.2
                litellm_params:
                  model: bedrock/converse/deepseek.v3.2
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.00000062
                  output_cost_per_token: 0.00000185
              - model_name: gpt-oss-120b
                litellm_params:
                  model: bedrock/converse/openai.gpt-oss-120b-1:0
                  aws_region_name: ${AWS::Region}
                  input_cost_per_token: 0.00000015
                  output_cost_per_token: 0.0000006
            general_settings:
              master_key: os.environ/LITELLM_MASTER_KEY
              database_url: os.environ/DATABASE_URL
            litellm_settings:
              drop_params: true
            CONFIG

            docker network create litellm || true
            docker run -d --name db --restart unless-stopped --network litellm \
              --env-file db.env -v /opt/litellm/pgdata:/var/lib/postgresql/data \
              ${PostgresImage}
            until docker exec db pg_isready -U litellm; do sleep 2; done
            docker run -d --name litellm --restart unless-stopped --network litellm \
              --env-file litellm.env -v /opt/litellm/config.yaml:/app/config.yaml:ro \
              -p 127.0.0.1:4000:4000 \
              ${LiteLLMImage} --config /app/config.yaml --port 4000

            # HTTPS in front of LiteLLM. Caddy gets and renews the certificate itself;
            # the Elastic IP may attach a few seconds after boot, and Caddy retries.
            cat > Caddyfile <<'CADDY'
            ${Hostname} {
            	reverse_proxy litellm:4000
            }
            CADDY
            mkdir -p /opt/litellm/caddy
            docker run -d --name caddy --restart unless-stopped --network litellm \
              -p 80:80 -p 443:443 \
              -v /opt/litellm/Caddyfile:/etc/caddy/Caddyfile:ro -v /opt/litellm/caddy:/data \
              ${CaddyImage}
            echo "litellm-setup: done"
          - Hostname: !If [HasDomain, !Ref DomainName, !Sub "${ElasticIp}.sslip.io"]

Outputs:
  InstanceId:
    Value: !Ref Instance
    Description: Target for scripts/tunnel.sh (SSM port forwarding)
  GatewayUrl:
    Value: !Sub
      - https://${Hostname}
      - Hostname: !If [HasDomain, !Ref DomainName, !Sub "${ElasticIp}.sslip.io"]
    Description: ANTHROPIC_BASE_URL for participants; Admin UI at /ui
